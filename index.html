<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#24585e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="親師通">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" id="mf" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<title>興嘉親師通</title>
<style>
:root{
  --ink:#1f2933; --ink2:#52606d; --ink3:#9aa5b1; --line:#e4e0d8;
  --bg:#f5f2ec; --card:#fff; --pri:#24585e; --pri2:#3c7f86; --priSoft:#e3efef;
  --acc:#d9822b; --accSoft:#fbeedd; --ok:#2f8a57; --okSoft:#e2f3e8; --bad:#c2453d; --badSoft:#fae4e2;
  --r:14px; --shadow:0 1px 2px rgba(31,41,51,.06),0 4px 14px rgba(31,41,51,.05);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  background:var(--bg);color:var(--ink);font-size:16px;line-height:1.55}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.app{max-width:640px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;background:var(--bg)}
/* header */
.hd{position:sticky;top:0;z-index:20;background:var(--pri);color:#fff;padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;
  display:flex;align-items:center;gap:10px}
.hd h1{font-size:18px;margin:0;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd small{display:block;font-size:12px;font-weight:400;opacity:.8}
.hd .ib{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff}
.hd .ib:active{background:rgba(255,255,255,.15)}
.sync-dot{width:8px;height:8px;border-radius:50%;background:#9be3b5;flex:none}
.sync-dot.busy{background:#ffd27a;animation:pulse 1s infinite}
.sync-dot.err{background:#ff9b93}
@keyframes pulse{50%{opacity:.3}}
/* main */
main{flex:1;padding:14px 14px calc(84px + env(safe-area-inset-bottom))}
.sec-t{display:flex;align-items:center;justify-content:space-between;margin:4px 2px 10px}
.sec-t h2{font-size:15px;margin:0;color:var(--ink2);font-weight:600}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px;margin-bottom:12px}
.card.unread{box-shadow:inset 4px 0 0 var(--acc),var(--shadow)}
.meta{font-size:12.5px;color:var(--ink3);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ttl{font-weight:700;font-size:16.5px;margin:4px 0 6px}
.body{white-space:pre-wrap;word-break:break-word;color:var(--ink)}
.body a{color:var(--pri2)}
.tag{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:99px;font-weight:600}
.tag.pri{background:var(--priSoft);color:var(--pri)}
.tag.acc{background:var(--accSoft);color:#a35d12}
.tag.ok{background:var(--okSoft);color:var(--ok)}
.tag.bad{background:var(--badSoft);color:var(--bad)}
.tag.gray{background:#eef0f2;color:var(--ink2)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.foot{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-top:12px;padding-top:10px;border-top:1px dashed var(--line);flex-wrap:wrap}
.btn{padding:9px 16px;border-radius:10px;font-weight:600;font-size:15px;background:var(--pri);color:#fff;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn:active{transform:scale(.97)}
.btn.sm{padding:6px 12px;font-size:14px;border-radius:9px}
.btn.ghost{background:var(--priSoft);color:var(--pri)}
.btn.line{background:#fff;color:var(--ink2);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.acc{background:var(--acc)}
.btn.bad{background:var(--bad)}
.btn.okb{background:var(--ok)}
.btn.block{width:100%;padding:13px}
.btn[disabled]{opacity:.5;pointer-events:none}
.link{color:var(--pri2);font-weight:600;font-size:14px}
.empty{text-align:center;color:var(--ink3);padding:48px 16px}
.empty .big{font-size:40px;margin-bottom:6px}
/* bars for poll */
.bar{margin:6px 0}
.bar .lb{display:flex;justify-content:space-between;font-size:14px}
.bar .tr{height:8px;background:#eef0f2;border-radius:99px;overflow:hidden;margin-top:3px}
.bar .tr i{display:block;height:100%;background:var(--pri2);border-radius:99px}
.opt{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;box-shadow:inset 0 0 0 1.5px var(--line);margin:6px 0;cursor:pointer}
.opt.on{box-shadow:inset 0 0 0 2px var(--pri);background:var(--priSoft)}
.opt input{accent-color:var(--pri);width:18px;height:18px}
/* nav */
.nav{position:fixed;bottom:0;left:0;right:0;z-index:20;background:#fff;border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom)}
.nav .in{max-width:640px;margin:0 auto;display:flex}
.nav button{flex:1;padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11.5px;color:var(--ink3);position:relative}
.nav button svg{width:24px;height:24px}
.nav button.on{color:var(--pri);font-weight:700}
.badge{position:absolute;top:3px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;line-height:1}
.fab{position:fixed;right:max(18px,calc(50% - 302px));bottom:calc(80px + env(safe-area-inset-bottom));z-index:19;width:56px;height:56px;border-radius:18px;background:var(--acc);color:#fff;box-shadow:0 6px 18px rgba(217,130,43,.4);display:grid;place-items:center}
.fab svg{width:28px;height:28px}
/* list rows */
.li{display:flex;align-items:center;gap:12px;padding:12px 14px;background:#fff;border-bottom:1px solid #f0ede7;cursor:pointer}
.li:first-child{border-radius:var(--r) var(--r) 0 0}.li:last-child{border-radius:0 0 var(--r) var(--r);border-bottom:0}
.li:only-child{border-radius:var(--r)}
.list{box-shadow:var(--shadow);border-radius:var(--r);margin-bottom:12px}
.av{width:42px;height:42px;border-radius:50%;background:var(--priSoft);color:var(--pri);display:grid;place-items:center;font-weight:700;flex:none;font-size:15px}
.li .mid{flex:1;min-width:0}
.li .nm{font-weight:600}
.li .pv{font-size:13.5px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .rt{text-align:right;font-size:12px;color:var(--ink3);display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.cnt{min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:var(--bad);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center}
/* chat */
.chat{display:flex;flex-direction:column;gap:6px;padding-bottom:8px}
.day{align-self:center;font-size:12px;color:var(--ink2);background:#e9e5dd;padding:2px 10px;border-radius:99px;margin:10px 0 4px}
.bub{max-width:80%;padding:9px 13px;border-radius:16px;white-space:pre-wrap;word-break:break-word;position:relative}
.bub.me{align-self:flex-end;background:var(--pri);color:#fff;border-bottom-right-radius:5px}
.bub.me a{color:#fff}
.bub.them{align-self:flex-start;background:#fff;box-shadow:var(--shadow);border-bottom-left-radius:5px}
.bub-meta{font-size:11px;color:var(--ink3);margin:-2px 4px 4px}
.bub-meta.me{align-self:flex-end}
.compose{position:fixed;bottom:calc(58px + env(safe-area-inset-bottom));left:0;right:0;z-index:18;background:var(--bg);border-top:1px solid var(--line)}
.compose .in{max-width:640px;margin:0 auto;padding:8px 10px;display:flex;gap:8px;align-items:flex-end}
.compose textarea{flex:1;resize:none;border:1.5px solid var(--line);border-radius:20px;padding:9px 14px;max-height:120px;background:#fff;outline:none}
.compose textarea:focus{border-color:var(--pri2)}
.compose .send{width:42px;height:42px;border-radius:50%;background:var(--pri);color:#fff;display:grid;place-items:center;flex:none}
.quiet{background:var(--accSoft);color:#8a4f0f;font-size:13px;padding:8px 12px;border-radius:10px;margin-bottom:10px}
/* forms */
label.f{display:block;margin:12px 0 4px;font-size:14px;font-weight:600;color:var(--ink2)}
.in-t{width:100%;padding:11px 13px;border-radius:10px;border:1.5px solid var(--line);background:#fff;outline:none}
.in-t:focus{border-color:var(--pri2)}
textarea.in-t{resize:vertical;min-height:90px}
.seg{display:flex;background:#ebe7df;border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;padding:9px;border-radius:9px;font-weight:600;color:var(--ink2)}
.seg button.on{background:#fff;color:var(--pri);box-shadow:var(--shadow)}
.hint{font-size:13px;color:var(--ink3);margin-top:6px}
.err{color:var(--bad);font-size:14px;min-height:20px;margin-top:8px}
/* login */
.login{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:24px 20px;max-width:440px;margin:0 auto}
.brand{text-align:center;margin-bottom:22px}
.logo{width:72px;height:72px;border-radius:22px;background:var(--pri);color:#fff;display:grid;place-items:center;margin:0 auto 12px;box-shadow:0 8px 24px rgba(36,88,94,.3)}
.logo svg{width:40px;height:40px}
.brand h1{margin:0;font-size:24px}
.brand p{margin:4px 0 0;color:var(--ink2);font-size:14px}
.demo-bar{background:#fff3d6;color:#7a5200;font-size:12.5px;text-align:center;padding:4px}
/* modal */
.mask{position:fixed;inset:0;background:rgba(20,28,36,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:#fff;width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));animation:up .2s ease-out}
@media(min-width:700px){.mask{align-items:center}.sheet{border-radius:20px;max-width:520px}}
.sheet h3{margin:0 0 6px;font-size:18px}
.sheet .acts{display:flex;gap:10px;margin-top:18px}
.sheet .acts .btn{flex:1;padding:12px}
@keyframes fade{from{opacity:0}}@keyframes up{from{transform:translateY(40px);opacity:.5}}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(31,41,51,.92);color:#fff;padding:10px 18px;border-radius:99px;z-index:60;font-size:14px;max-width:86vw;text-align:center;animation:fade .2s}
table.tb{width:100%;border-collapse:collapse;font-size:14px}
table.tb th,table.tb td{padding:8px 6px;border-bottom:1px solid #f0ede7;text-align:left}
table.tb th{color:var(--ink2);font-weight:600;font-size:13px}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:1px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{font-size:13px;padding:3px 10px;border-radius:99px;background:#f1efe9}
.chip.no{background:var(--badSoft);color:var(--bad)}
.reply{background:#f7f5f0;border-radius:10px;padding:8px 10px;margin-top:6px;font-size:14px}
.att-grid{display:grid;gap:4px;margin:6px 0;max-width:260px}
.att-grid.n1{grid-template-columns:1fr}.att-grid.n2{grid-template-columns:1fr 1fr}.att-grid.n3{grid-template-columns:1fr 1fr 1fr}
.att-img{padding:0;border-radius:12px;overflow:hidden;background:#e9e5dd;aspect-ratio:1/1;display:block}
.att-grid.n1 .att-img{aspect-ratio:auto;min-height:120px}
.att-img img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .2s}
.att-img img.ok{opacity:1}
.att-file{display:flex;gap:10px;align-items:center;text-align:left;background:#fff;box-shadow:inset 0 0 0 1.5px var(--line);border-radius:12px;padding:9px 12px;margin:6px 0;max-width:280px;width:100%}
.att-file .fi{font-size:26px}.att-file .fn{min-width:0;display:flex;flex-direction:column}
.att-file b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.att-file small{font-size:12px;color:var(--ink3)}
.lcard{display:flex;gap:10px;align-items:center;background:#fff;box-shadow:inset 0 0 0 1.5px var(--line);border-radius:12px;padding:8px;margin:6px 0;max-width:300px;text-decoration:none;color:var(--ink)}
.lcard img{width:96px;height:54px;object-fit:cover;border-radius:8px;flex:none}
.lcard .lic{width:38px;height:38px;border-radius:9px;background:var(--priSoft);display:grid;place-items:center;flex:none}
.lcard span{min-width:0;display:flex;flex-direction:column}.lcard b{font-size:14px}.lcard small{font-size:12px;color:var(--ink3);word-break:break-all}
.mg{display:flex;flex-direction:column;max-width:82%}
.mg.me{align-self:flex-end;align-items:flex-end}.mg.them{align-self:flex-start;align-items:flex-start}
.mg .bub{max-width:100%}
.stk{width:116px;height:116px;border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;box-shadow:var(--shadow)}
.stk .se{font-size:50px;line-height:1}.stk .st{font-size:14px;font-weight:700;color:var(--ink);background:#fff;padding:1px 10px;border-radius:99px}
.stk-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.stk-grid button{padding:0;display:grid;place-items:center}.stk-grid .stk{width:100%;height:auto;aspect-ratio:1/1}.stk-grid .stk .se{font-size:40px}
.compose .cbtn{width:38px;height:42px;display:grid;place-items:center;color:var(--ink2);font-size:22px;flex:none}
.compose .cbtn svg{width:24px;height:24px}
.pend{display:flex;gap:8px;overflow-x:auto;padding:8px 10px 0;max-width:640px;margin:0 auto}
.pend:empty{display:none}
.pd{position:relative;flex:none;width:64px;height:64px;border-radius:10px;overflow:hidden;background:#fff;box-shadow:inset 0 0 0 1.5px var(--line)}
.pd img{width:100%;height:100%;object-fit:cover}
.pd .pf{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;font-size:22px;padding:2px}
.pd .pf small{font-size:9px;max-width:60px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pd button{position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;font-size:11px;line-height:20px;padding:0}
.viewer{position:fixed;inset:0;background:rgba(10,14,18,.94);z-index:70;display:flex;flex-direction:column;animation:fade .15s}
.viewer .vi{flex:1;display:grid;place-items:center;overflow:auto;padding:12px}
.viewer img{max-width:100%;max-height:82vh;border-radius:6px}
.viewer .vb{display:flex;gap:10px;justify-content:center;padding:12px 12px calc(14px + env(safe-area-inset-bottom))}
.menu-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.menu-grid button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 4px;border-radius:14px;background:#f5f2ec;font-size:14px;font-weight:600}
.menu-grid button span{font-size:28px}
.patt{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.adopt{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.adopt button{background:#f5f2ec;border-radius:12px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:2px}
.adopt b{font-size:22px;color:var(--pri);line-height:1.1}.adopt b small{font-size:12px;color:var(--ink3);font-weight:600}
.adopt span{font-size:12px;color:var(--ink2);font-weight:600}
#print{display:none}
@media print{
  body *{visibility:hidden}
  #print,#print *{visibility:visible}
  #print{display:block;position:absolute;left:0;top:0;width:100%}
  .slip{border:1.5px dashed #888;padding:14px 18px;margin:0 0 10px;page-break-inside:avoid;font-size:14px}
  .slip h4{margin:0 0 6px;font-size:16px}
}
</style>
</head>
<body>
<div id="root"></div>
<div id="print"></div>

<script>
/* ========= 設定：部署 GAS 後把網址貼在這裡（也可在登入畫面的「連線設定」填寫） ========= */
var DEFAULT_GAS_URL = '';
</script>

<script>
// ===================== 親師通 共用核心（前端示範模式與 GAS 共用同一份） =====================
// 每班一份試算表，班級固定代碼
var CLASS_ID = 'main';
var TABLES = {
  Classes:  ['classId','className','teacherName','teacherHash','quietStart','quietEnd','created'],
  Students: ['classId','seat','name','parentName','pinHash','pinInit','updated','firstSeen','lastSeen','app','appSeen','device','notify'],
  Posts:    ['id','classId','type','title','body','options','date','requireAck','created','att'],
  Acks:     ['postId','classId','seat','choice','reply','ts'],
  Messages: ['id','classId','seat','from','body','ts','readT','readP','kind','att'],
  Files:    ['id','classId','seat','fileId','name','mime','size','thumb','ts','by'],
  Leaves:   ['id','classId','seat','date','kind','reason','status','note','ts']
};

// 原創貼圖（伺服器驗證用，前端依此繪製）
var STICKERS = [
  ['s1','👍','收到'],['s2','🙏','謝謝老師'],['s3','😊','辛苦了'],['s4','👌','沒問題'],['s5','🙇','不好意思'],['s6','💪','加油'],
  ['s7','👏','好棒'],['s8','❤️','感恩'],['s9','✅','已完成'],['s10','📚','功課寫完了'],['s11','🤒','孩子不舒服'],['s12','🤔','想請問'],
  ['s13','☀️','早安'],['s14','🌙','晚安'],['s15','🎉','恭喜'],['s16','⏰','會準時'],['s17','🌟','表現優秀'],['s18','📝','請簽聯絡簿']
];
var MAX_FILE_B64 = 14000000; // 約 10MB
function S_(v){ return v === null || v === undefined ? '' : String(v); }
function E_(msg){ var e = new Error(msg); e.userMsg = true; return e; }
function parseArr_(v){ try { var a = JSON.parse(S_(v) || '[]'); return Array.isArray(a) ? a : []; } catch (e) { return []; } }
// 取出附件中繼資料並檢查歸屬（seat 為 '' 代表全班公告用）
function pickFiles_(db, classId, ids, seat){
  ids = (ids || []).slice(0, 9).map(S_);
  return ids.map(function(id){
    var f = db.all('Files').filter(function(r){ return S_(r.id) === id && S_(r.classId) === classId; })[0];
    if (!f || S_(f.seat) !== S_(seat)) throw E_('附件已失效，請重新選擇');
    return { id: id, name: S_(f.name), mime: S_(f.mime), size: Number(f.size) || 0, thumb: !!S_(f.thumb) };
  });
}
function dropFiles_(env, db, pred){
  db.all('Files').filter(pred).forEach(function(f){ try { if (env.deleteFile) env.deleteFile(S_(f.fileId)); } catch (e) {} });
  db.remove('Files', pred);
}
function trimLen_(v, max, label){
  v = S_(v).trim();
  if (v.length > max) throw E_(label + '不可超過 ' + max + ' 字');
  return v;
}
function genPin_(){ var s=''; for (var i=0;i<6;i++) s += Math.floor(Math.random()*10); return s; }
function teacherHash_(env, classId, pw){ return env.sha256('T|' + classId + '|' + pw); }
function pinHash_(env, classId, seat, pin){ return env.sha256('P|' + classId + '|' + seat + '|' + pin); }
function findClass_(db, classId){
  var c = db.all('Classes').filter(function(r){ return S_(r.classId) === S_(classId); })[0];
  if (!c) throw E_('老師尚未完成班級設定');
  return c;
}
function findStudent_(db, classId, seat){
  return db.all('Students').filter(function(r){ return S_(r.classId) === S_(classId) && S_(r.seat) === S_(seat); })[0];
}

// token = payload.signature ；signature 綁定目前的密碼雜湊，改密碼後舊 token 自動失效
var TOKEN_DAYS = 30;
function makeToken_(env, role, classId, seat, credHash){
  var payload = [role, classId, S_(seat), env.now() + TOKEN_DAYS*86400000].join('|');
  return payload + '.' + env.sha256(env.secret + '|' + payload + '|' + S_(credHash).slice(0,16));
}
function verifyToken_(env, db, token){
  token = S_(token);
  var i = token.lastIndexOf('.');
  if (i < 0) throw E_('請重新登入');
  var payload = token.slice(0,i), sig = token.slice(i+1), a = payload.split('|');
  if (a.length !== 4 || Number(a[3]) < env.now()) throw E_('登入已逾時，請重新登入');
  var cls = findClass_(db, a[1]), cred;
  if (a[0] === 't') cred = cls.teacherHash;
  else { var st = findStudent_(db, a[1], a[2]); if (!st) throw E_('帳號已被移除'); cred = st.pinHash; }
  if (env.sha256(env.secret + '|' + payload + '|' + S_(cred).slice(0,16)) !== sig) throw E_('請重新登入');
  return { r: a[0], c: a[1], s: a[2], cls: cls };
}

var ACTIONS = {
  info: { fn: function(env, db){
    var c = db.all('Classes').filter(function(r){ return S_(r.classId) === CLASS_ID; })[0];
    return { ready: !!c, className: S_(c && c.className), teacherName: S_(c && c.teacherName), appUrl: S_(env.appUrl) };
  }},

  teacherLogin: { fn: function(env, db, p){
    var c = findClass_(db, S_(p.classId || CLASS_ID).trim());
    if (teacherHash_(env, c.classId, S_(p.password)) !== S_(c.teacherHash)) throw E_('密碼錯誤');
    return { token: makeToken_(env, 't', c.classId, '', c.teacherHash) };
  }},

  parentLogin: { fn: function(env, db, p){
    var c = findClass_(db, S_(p.classId || CLASS_ID).trim());
    var st = findStudent_(db, c.classId, S_(p.seat).trim());
    if (!st) throw E_('查無此座號，請向老師確認');
    if (pinHash_(env, c.classId, st.seat, S_(p.pin).trim()) !== S_(st.pinHash)) throw E_('密碼錯誤');
    return { token: makeToken_(env, 'p', c.classId, st.seat, st.pinHash), mustChange: !!S_(st.pinInit) };
  }},

  changePin: { auth: 'p', write: true, fn: function(env, db, p, x){
    var st = findStudent_(db, x.c, x.s);
    if (pinHash_(env, x.c, x.s, S_(p.oldPin)) !== S_(st.pinHash)) throw E_('舊密碼錯誤');
    var np = S_(p.newPin);
    if (np.length < 4 || np.length > 20) throw E_('新密碼需 4–20 碼');
    var h = pinHash_(env, x.c, x.s, np);
    db.update('Students', function(r){ return S_(r.classId)===x.c && S_(r.seat)===x.s; }, { pinHash: h, pinInit: '', updated: env.now() });
    return { token: makeToken_(env, 'p', x.c, x.s, h) };
  }},

  changeTeacherPw: { auth: 't', write: true, fn: function(env, db, p, x){
    if (teacherHash_(env, x.c, S_(p.oldPw)) !== S_(x.cls.teacherHash)) throw E_('舊密碼錯誤');
    if (S_(p.newPw).length < 4) throw E_('新密碼至少 4 碼');
    var h = teacherHash_(env, x.c, S_(p.newPw));
    db.update('Classes', function(r){ return S_(r.classId)===x.c; }, { teacherHash: h });
    return { token: makeToken_(env, 't', x.c, '', h) };
  }},

  saveSettings: { auth: 't', write: true, fn: function(env, db, p, x){
    var t = /^\d{2}:\d{2}$/;
    if ((p.quietStart && !t.test(p.quietStart)) || (p.quietEnd && !t.test(p.quietEnd))) throw E_('時間格式錯誤');
    db.update('Classes', function(r){ return S_(r.classId)===x.c; }, {
      className: trimLen_(p.className, 30, '班級名稱') || x.c,
      teacherName: trimLen_(p.teacherName, 20, '老師稱呼') || '導師',
      quietStart: S_(p.quietStart), quietEnd: S_(p.quietEnd) });
    return {};
  }},

  setStudents: { auth: 't', write: true, fn: function(env, db, p, x){
    var list = p.list || [], created = 0, updated = 0;
    if (list.length > 60) throw E_('一次最多 60 位');
    list.forEach(function(it){
      var seat = S_(it.seat).trim().replace(/^0+(?=\d)/, '');
      if (!/^\d{1,3}$/.test(seat)) throw E_('座號格式錯誤：' + it.seat);
      var name = trimLen_(it.name, 20, '姓名'), pn = trimLen_(it.parentName, 20, '家長稱呼');
      if (!name) throw E_('座號 ' + seat + ' 缺少姓名');
      if (findStudent_(db, x.c, seat)) {
        db.update('Students', function(r){ return S_(r.classId)===x.c && S_(r.seat)===seat; }, { name: name, parentName: pn, updated: env.now() });
        updated++;
      } else {
        var pin = genPin_();
        db.insert('Students', { classId: x.c, seat: seat, name: name, parentName: pn,
          pinHash: pinHash_(env, x.c, seat, pin), pinInit: pin, updated: env.now() });
        created++;
      }
    });
    return { created: created, updated: updated };
  }},

  resetPin: { auth: 't', write: true, fn: function(env, db, p, x){
    var seat = S_(p.seat);
    if (!findStudent_(db, x.c, seat)) throw E_('查無此座號');
    var pin = genPin_();
    db.update('Students', function(r){ return S_(r.classId)===x.c && S_(r.seat)===seat; },
      { pinHash: pinHash_(env, x.c, seat, pin), pinInit: pin, updated: env.now() });
    return { pin: pin };
  }},

  removeStudent: { auth: 't', write: true, fn: function(env, db, p, x){
    var seat = S_(p.seat), m = function(r){ return S_(r.classId)===x.c && S_(r.seat)===seat; };
    dropFiles_(env, db, m);
    db.remove('Students', m); db.remove('Messages', m); db.remove('Acks', m); db.remove('Leaves', m);
    return {};
  }},

  post: { auth: 't', write: true, fn: function(env, db, p, x){
    var type = S_(p.type);
    if (['announce','contact','poll'].indexOf(type) < 0) throw E_('類型錯誤');
    var opts = [];
    if (type === 'poll') {
      opts = (p.options || []).map(function(o){ return trimLen_(o, 40, '選項'); }).filter(Boolean);
      if (opts.length < 2) throw E_('回條至少要 2 個選項');
    }
    var body = trimLen_(p.body, 3000, '內容');
    var title = trimLen_(p.title, 60, '標題');
    if (type !== 'contact' && !title) throw E_('請輸入標題');
    var att = pickFiles_(db, x.c, p.att, '');
    if (!body && type !== 'poll' && !att.length) throw E_('請輸入內容');
    var date = S_(p.date);
    if (type === 'contact' && !/^\d{4}-\d{2}-\d{2}$/.test(date)) throw E_('請選擇日期');
    var id = env.uid();
    db.insert('Posts', { id: id, classId: x.c, type: type, title: title, body: body, options: JSON.stringify(opts),
      date: date, requireAck: (type !== 'announce' || p.requireAck) ? '1' : '0', created: env.now(), att: att.length ? JSON.stringify(att) : '' });
    return { id: id };
  }},

  deletePost: { auth: 't', write: true, fn: function(env, db, p, x){
    var id = S_(p.id);
    db.all('Posts').filter(function(r){ return S_(r.id)===id && S_(r.classId)===x.c; }).forEach(function(r){
      var ids = parseArr_(r.att).map(function(a){ return S_(a.id); });
      dropFiles_(env, db, function(f){ return S_(f.classId)===x.c && ids.indexOf(S_(f.id)) >= 0; });
    });
    db.remove('Posts', function(r){ return S_(r.id)===id && S_(r.classId)===x.c; });
    db.remove('Acks', function(r){ return S_(r.postId)===id && S_(r.classId)===x.c; });
    return {};
  }},

  ack: { auth: 'p', write: true, fn: function(env, db, p, x){
    var id = S_(p.postId);
    var post = db.all('Posts').filter(function(r){ return S_(r.id)===id && S_(r.classId)===x.c; })[0];
    if (!post) throw E_('此訊息已被刪除');
    var choice = '';
    if (post.type === 'poll') {
      var opts = JSON.parse(S_(post.options) || '[]');
      choice = S_(p.choice);
      if (opts.indexOf(choice) < 0) throw E_('請選擇一個選項');
    }
    var reply = trimLen_(p.reply, 500, '回覆');
    var m = function(r){ return S_(r.postId)===id && S_(r.classId)===x.c && S_(r.seat)===x.s; };
    if (db.all('Acks').some(m)) db.update('Acks', m, { choice: choice, reply: reply, ts: env.now() });
    else db.insert('Acks', { postId: id, classId: x.c, seat: x.s, choice: choice, reply: reply, ts: env.now() });
    return {};
  }},

  sendMsg: { auth: '*', write: true, fn: function(env, db, p, x){
    var seat = x.r === 't' ? S_(p.seat) : x.s;
    if (!findStudent_(db, x.c, seat)) throw E_('查無此家長');
    var kind = S_(p.kind) === 'sticker' ? 'sticker' : 'text';
    var body = trimLen_(p.body, 2000, '訊息'), att = [];
    if (kind === 'sticker') {
      if (!STICKERS.some(function(s){ return s[0] === body; })) throw E_('貼圖不存在');
    } else {
      att = pickFiles_(db, x.c, p.att, seat);
      if (!body && !att.length) throw E_('請輸入訊息');
    }
    var id = env.uid();
    db.insert('Messages', { id: id, classId: x.c, seat: seat, from: x.r, body: body, ts: env.now(),
      readT: x.r === 't' ? '1' : '0', readP: x.r === 'p' ? '1' : '0', kind: kind, att: att.length ? JSON.stringify(att) : '' });
    return { id: id };
  }},

  markRead: { auth: '*', write: true, fn: function(env, db, p, x){
    var seat = x.r === 't' ? S_(p.seat) : x.s;
    var field = x.r === 't' ? 'readT' : 'readP', other = x.r === 't' ? 'p' : 't';
    var m = function(r){ return S_(r.classId)===x.c && S_(r.seat)===seat && S_(r.from)===other && S_(r[field])!=='1'; };
    if (!db.all('Messages').some(m)) return { n: 0 };
    var patch = {}; patch[field] = '1';
    return { n: db.update('Messages', m, patch) };
  }},

  leave: { auth: 'p', write: true, fn: function(env, db, p, x){
    if (!/^\d{4}-\d{2}-\d{2}$/.test(S_(p.date))) throw E_('請選擇日期');
    var kind = S_(p.kind);
    if (['病假','事假','喪假','公假','其他'].indexOf(kind) < 0) throw E_('假別錯誤');
    var id = env.uid();
    db.insert('Leaves', { id: id, classId: x.c, seat: x.s, date: S_(p.date) + (p.dateEnd && p.dateEnd !== p.date ? '~' + S_(p.dateEnd) : ''),
      kind: kind, reason: trimLen_(p.reason, 300, '事由'), status: 'pending', note: '', ts: env.now() });
    return { id: id };
  }},

  cancelLeave: { auth: 'p', write: true, fn: function(env, db, p, x){
    var id = S_(p.id);
    var n = db.remove('Leaves', function(r){ return S_(r.id)===id && S_(r.classId)===x.c && S_(r.seat)===x.s && S_(r.status)==='pending'; });
    if (!n) throw E_('老師已處理，無法取消');
    return {};
  }},

  decideLeave: { auth: 't', write: true, fn: function(env, db, p, x){
    var st = S_(p.status);
    if (['approved','rejected'].indexOf(st) < 0) throw E_('狀態錯誤');
    var id = S_(p.id);
    db.update('Leaves', function(r){ return S_(r.id)===id && S_(r.classId)===x.c; }, { status: st, note: trimLen_(p.note, 200, '備註') });
    return {};
  }},

  upload: { auth: '*', write: true, fn: function(env, db, p, x){
    var seat = x.r === 't' ? S_(p.seat) : x.s;
    if (seat && !findStudent_(db, x.c, seat)) throw E_('查無此家長');
    var data = S_(p.data), thumb = S_(p.thumb);
    if (!data) throw E_('檔案是空的');
    if (data.length > MAX_FILE_B64) throw E_('檔案太大（上限 10MB）');
    if (thumb.length > 45000) thumb = '';
    var name = S_(p.name).replace(/[\\/:*?"<>|]/g, '_').slice(0, 100) || 'file';
    var mime = S_(p.mime).slice(0, 100) || 'application/octet-stream';
    var fileId = env.saveFile(name, mime, data);
    var id = env.uid(), size = Math.round(data.length * 3 / 4);
    db.insert('Files', { id: id, classId: x.c, seat: seat, fileId: fileId, name: name, mime: mime, size: size, thumb: thumb, ts: env.now(), by: x.r });
    return { id: id, name: name, mime: mime, size: size };
  }},

  file: { auth: '*', fn: function(env, db, p, x){
    var id = S_(p.id);
    var f = db.all('Files').filter(function(r){ return S_(r.id) === id && S_(r.classId) === x.c; })[0];
    if (!f || (x.r === 'p' && S_(f.seat) !== '' && S_(f.seat) !== x.s)) throw E_('找不到檔案');
    if (p.thumb && S_(f.thumb)) return { thumb: S_(f.thumb) };
    return { data: env.readFile(S_(f.fileId)), mime: S_(f.mime), name: S_(f.name) };
  }},

  sync: { auth: '*', fn: function(env, db, p, x){
    var c = x.cls, isT = x.r === 't';
    var inClass = function(r){ return S_(r.classId) === x.c; };
    var mine = function(r){ return isT || S_(r.seat) === x.s; };
    if (!isT && p.client) touchParent_(env, db, x, p.client);
    var students = db.all('Students').filter(inClass);
    var out = {
      serverTime: env.now(),
      cls: { classId: c.classId, className: S_(c.className), teacherName: S_(c.teacherName), quietStart: S_(c.quietStart), quietEnd: S_(c.quietEnd), appUrl: S_(env.appUrl) },
      me: { role: x.r, seat: x.s },
      posts: db.all('Posts').filter(inClass).map(function(r){
        return { id: S_(r.id), type: S_(r.type), title: S_(r.title), body: S_(r.body), options: JSON.parse(S_(r.options) || '[]'),
          date: S_(r.date), requireAck: S_(r.requireAck) === '1', created: Number(r.created), att: parseArr_(r.att) };
      }).sort(function(a,b){ return b.created - a.created; }).slice(0, 300),
      acks: db.all('Acks').filter(inClass).filter(mine).map(function(r){
        return { postId: S_(r.postId), seat: S_(r.seat), choice: S_(r.choice), reply: S_(r.reply), ts: Number(r.ts) };
      }),
      messages: db.all('Messages').filter(inClass).filter(mine).map(function(r){
        return { id: S_(r.id), seat: S_(r.seat), from: S_(r.from), body: S_(r.body), ts: Number(r.ts), readT: S_(r.readT)==='1', readP: S_(r.readP)==='1', kind: S_(r.kind) || 'text', att: parseArr_(r.att) };
      }),
      leaves: db.all('Leaves').filter(inClass).filter(mine).map(function(r){
        return { id: S_(r.id), seat: S_(r.seat), date: S_(r.date), kind: S_(r.kind), reason: S_(r.reason), status: S_(r.status), note: S_(r.note), ts: Number(r.ts) };
      }).sort(function(a,b){ return b.ts - a.ts; })
    };
    if (isT) {
      out.students = students.map(function(r){
        return { seat: S_(r.seat), name: S_(r.name), parentName: S_(r.parentName), pinInit: S_(r.pinInit),
          firstSeen: Number(r.firstSeen) || 0, lastSeen: Number(r.lastSeen) || 0, app: S_(r.app) === '1', appSeen: Number(r.appSeen) || 0,
          device: S_(r.device), notify: S_(r.notify) === '1' };
      }).sort(function(a,b){ return Number(a.seat) - Number(b.seat); });
    } else {
      var me = students.filter(function(r){ return S_(r.seat) === x.s; })[0];
      out.me.name = S_(me && me.name); out.me.parentName = S_(me && me.parentName);
      out.me.mustChange = !!S_(me && me.pinInit);
    }
    return out;
  }}
};

// 家長使用狀況：上線時間、是否裝成 App、裝置、通知（只在有變化或隔 10 分鐘才寫入，減少試算表寫入）
function touchParent_(env, db, x, c){
  var st = findStudent_(db, x.c, x.s); if (!st) return;
  var now = env.now(), patch = {}, dev = S_(c.dev).slice(0, 10), standalone = !!c.standalone;
  if (!Number(st.firstSeen)) patch.firstSeen = now;
  if (now - (Number(st.lastSeen) || 0) > 600000) patch.lastSeen = now;
  if (standalone && S_(st.app) !== '1') patch.app = '1';
  if (standalone && now - (Number(st.appSeen) || 0) > 600000) patch.appSeen = now;
  if (dev && dev !== S_(st.device)) patch.device = dev;
  var nf = c.notify ? '1' : '0';
  if (nf !== S_(st.notify)) patch.notify = nf;
  if (!Object.keys(patch).length) return;
  try { db.update('Students', function(r){ return S_(r.classId) === x.c && S_(r.seat) === x.s; }, patch); } catch (e) {}
}
function coreHandle(env, db, action, p){
  var A = ACTIONS[action];
  if (!A) throw E_('未知的動作');
  var x = null;
  if (A.auth) {
    x = verifyToken_(env, db, p && p.token);
    if (A.auth !== '*' && A.auth !== x.r) throw E_(A.auth === 't' ? '需要老師權限' : '僅限家長操作');
  }
  return A.fn(env, db, p || {}, x);
}
// ===================== 核心結束 =====================

function sha256Sync(str){
  var b = unescape(encodeURIComponent(str)), K = [], H = [], i, j;
  var isP = function(n){ for (var f=2; f*f<=n; f++) if (n%f===0) return false; return true; };

  var w = [], l = b.length * 8;
  b += '\x80'; while (b.length % 64 !== 56) b += '\x00';
  var words = []; for (i=0; i<b.length; i++) words[i>>2] |= b.charCodeAt(i) << ((3 - i%4) * 8);
  words.push(Math.floor(l / 4294967296)); words.push(l | 0);
  var r = function(x, n){ return (x >>> n) | (x << (32 - n)); };
  for (j=0; j<words.length; j+=16) {
    var a=H[0],bb=H[1],cc=H[2],d=H[3],e=H[4],f=H[5],g=H[6],h=H[7];
    for (i=0; i<64; i++) {
      if (i<16) w[i] = words[j+i] | 0;
      else { var s0 = r(w[i-15],7)^r(w[i-15],18)^(w[i-15]>>>3), s1 = r(w[i-2],17)^r(w[i-2],19)^(w[i-2]>>>10); w[i] = (w[i-16]+s0+w[i-7]+s1) | 0; }
      var t1 = (h + (r(e,6)^r(e,11)^r(e,25)) + ((e&f)^(~e&g)) + K[i] + w[i]) | 0;
      var t2 = ((r(a,2)^r(a,13)^r(a,22)) + ((a&bb)^(a&cc)^(bb&cc))) | 0;
      h=g; g=f; f=e; e=(d+t1)|0; d=cc; cc=bb; bb=a; a=(t1+t2)|0;
    }
    H[0]=(H[0]+a)|0; H[1]=(H[1]+bb)|0; H[2]=(H[2]+cc)|0; H[3]=(H[3]+d)|0; H[4]=(H[4]+e)|0; H[5]=(H[5]+f)|0; H[6]=(H[6]+g)|0; H[7]=(H[7]+h)|0;
  }
  return H.map(function(x){ return ('00000000' + (x >>> 0).toString(16)).slice(-8); }).join('');
}
var DEMO_KEY = 'xj_pt_demo_db_v3';

function fmtAgo(ts){
  if (!ts) return '尚未上線';
  var m = Math.floor((Date.now() - ts) / 60000);
  if (m < 15) return '剛剛'; if (m < 60) return m + ' 分鐘前';
  var h = Math.floor(m / 60); if (h < 24) return h + ' 小時前';
  var d = Math.floor(h / 24); return d < 30 ? d + ' 天前' : Math.floor(d / 30) + ' 個月前';
}

function D(){ return S.data; }
function appUrl(){ return (D() && D().cls.appUrl) || (S.info && S.info.appUrl) || (location.protocol.indexOf('http') === 0 ? location.href.split('#')[0].split('?')[0] : ''); }
function qrSrc(u, size){ return 'https://api.qrserver.com/v1/create-qr-code/?size=' + size + 'x' + size + '&margin=4&data=' + encodeURIComponent(u); }
function isT(){ return D() && D().me.role === 't'; }
function ackOf(postId, seat){ return D().acks.filter(function(a){ return a.postId === postId && (seat == null || a.seat === String(seat)); }); }
function myAck(postId){ return ackOf(postId, D().me.seat)[0]; }
function stuName(seat){ var s = (D().students || []).filter(function(x){ return x.seat === String(seat); })[0]; return s ? s.name : ('座號 ' + seat); }
function stuLabel(seat){ var s = (D().students || []).filter(function(x){ return x.seat === String(seat); })[0]; return s ? (s.seat + '號 ' + s.name + (s.parentName ? '（' + s.parentName + '）' : '')) : ('座號 ' + seat); }
function counts(){
  var d = D(), c = { news:0, book:0, chat:0, leave:0 };
  if (!d) return c;
  if (isT()) {
    c.chat = d.messages.filter(function(m){ return m.from === 'p' && !m.readT; }).length;
    c.leave = d.leaves.filter(function(l){ return l.status === 'pending'; }).length;
  } else {
    d.posts.forEach(function(p){ if (p.requireAck && !myAck(p.id)) { if (p.type === 'contact') c.book++; else c.news++; } });
    c.chat = d.messages.filter(function(m){ return m.from === 't' && !m.readP; }).length;
  }
  return c;
}
function inQuiet(){
  var c = D().cls; if (!c.quietStart || !c.quietEnd) return false;
  var n = new Date(), t = pad(n.getHours()) + ':' + pad(n.getMinutes());
  return c.quietStart > c.quietEnd ? (t >= c.quietStart || t < c.quietEnd) : (t >= c.quietStart && t < c.quietEnd);
}

/* ===================== 公告 / 回條 ===================== */
function viewNews(){
  var d = D(), list = d.posts.filter(function(p){ return p.type !== 'contact'; });
  var html = '';
  if (!list.length) html = emptyBox('📢', isT() ? '還沒有公告，點右下角 ＋ 發布第一則' : '目前沒有公告');
  list.forEach(function(p){
    var n = d.students ? d.students.length : 0, acks = ackOf(p.id), mine = !isT() && myAck(p.id);
    var need = !isT() && p.requireAck && !mine;
    html += '<div class="card' + (need ? ' unread' : '') + '">' +
      '<div class="meta">' + (p.type === 'poll' ? '<span class="tag acc">回條</span>' : '<span class="tag pri">公告</span>') +
        (need ? '<span class="tag bad">待回覆</span>' : '') + '<span>' + fmtTime(p.created) + '</span></div>' +
      '<div class="ttl">' + esc(p.title) + '</div>' + (p.body ? '<div class="body">' + linkify(p.body) + '</div>' + linkCards(p.body) : '') + attHtml(p.att);
    if (p.type === 'poll') {
      if (isT()) html += pollBars(p, acks);
      else if (mine) html += '<div class="reply">你的回覆：<b>' + esc(mine.choice) + '</b>' + (mine.reply ? '<br>' + esc(mine.reply) : '') + '</div>';
    }
    html += '<div class="foot">';
    if (isT()) {
      html += (p.requireAck ? '<button class="link" data-act="ackList" data-id="' + p.id + '">' + (p.type === 'poll' ? '已回覆' : '已讀') + ' ' + acks.length + ' / ' + n + ' ›</button>' : '<span class="meta">不需回條</span>') +
        '<button class="btn sm line" data-act="delPost" data-id="' + p.id + '">刪除</button>';
    } else {
      if (p.type === 'poll') html += '<span class="meta">' + (mine ? '已於 ' + fmtTime(mine.ts) + ' 回覆' : '請勾選後送出') + '</span><button class="btn sm ' + (mine ? 'line' : 'acc') + '" data-act="pollReply" data-id="' + p.id + '">' + (mine ? '修改回覆' : '填寫回條') + '</button>';
      else if (p.requireAck) html += mine ? '<span class="tag ok">✓ 已讀 ' + fmtTime(mine.ts) + '</span>' : '<span class="meta">請按已讀讓老師知道</span><button class="btn sm acc" data-act="ackRead" data-id="' + p.id + '">我已閱讀</button>';
    }
    html += '</div></div>';
  });
  return '<div class="sec-t"><h2>公告與回條</h2></div>' + html + (isT() ? fab('newPost') : '');
}
function pollBars(p, acks){
  var n = acks.length || 1;
  return '<div style="margin-top:10px">' + p.options.map(function(o){
    var k = acks.filter(function(a){ return a.choice === o; }).length;
    return '<div class="bar"><div class="lb"><span>' + esc(o) + '</span><b>' + k + '</b></div><div class="tr"><i style="width:' + Math.round(k / n * 100) + '%"></i></div></div>';
  }).join('') + '</div>';
}

  var d = D(), list = d.posts.filter(function(p){ return p.type === 'contact'; }).sort(function(a, b){ return b.date < a.date ? -1 : b.date > a.date ? 1 : b.created - a.created; });

  if (!list.length) html = emptyBox('📒', isT() ? '點右下角 ＋ 寫今天的聯絡簿' : '老師還沒有發聯絡簿');
  list.forEach(function(p){
    var acks = ackOf(p.id), mine = !isT() && myAck(p.id), n = d.students ? d.students.length : 0;

function threadKey(){ return String(S.thread || 'p'); }
function addPend(files){

function bindCompose(){

    var items = [].slice.call((e.clipboardData && e.clipboardData.items) || []).filter(function(it){ return it.kind === 'file'; });

  var add = function(fs){ fs.forEach(function(f){ if (list.length < 9) list.push(f); }); draw(); };
  $('#pImg', m).onclick = function(){ pickFiles('image/*', add); };
  $('#pFile', m).onclick = function(){ pickFiles('', add); };
  return function(){ return list; };
}

/* 下載：先把檔案準備好，再讓使用者「親手」按儲存（手機瀏覽器規定分享／下載必須是點擊當下觸發） */
function saveSheet(id, name){
  var m = modal('<h3>' + esc(name) + '</h3><div class="hint" id="svS">檔案準備中…</div><div id="svB"></div><div class="acts"><button class="btn line" id="x">關閉</button></div>', function(mm, c){ $('#x', mm).onclick = c; });
  attFetch(id, false).then(function(u){
    var blob = ATT.blob[id], file = null;
    try { file = new File([blob], name, { type: blob.type || 'application/octet-stream' }); } catch(e){}
    var mobile = IS_IOS || /android/i.test(navigator.userAgent);
    var canShare = !!(file && navigator.canShare && (function(){ try { return navigator.canShare({ files: [file] }); } catch(e){ return false; } })());
    var b = '';
    if (canShare && mobile) b += '<button class="btn block acc" id="svShare" style="margin-top:10px">📥 儲存到手機（照片／檔案）</button>';
    if (!IN_GAS && !(IS_IOS && IS_STANDALONE)) b += '<button class="btn block' + (canShare && mobile ? ' ghost' : '') + '" id="svDl" style="margin-top:10px">⬇️ 下載</button>';
    b += '<button class="btn block line" id="svOpen" style="margin-top:10px">🔎 開啟檢視</button>';
    if (IN_GAS && /\?s=|\?u=/.test(appUrl())) b += '<p class="hint">下載不順？改用 <a href="' + esc(appUrl()) + '" target="_top">App 版</a> 開啟親師通，下載最穩定。</p>';
    else if (IS_IOS) b += '<p class="hint">iPhone：選「儲存影像」存到照片，或「儲存到檔案」。若用 LINE 開啟，請改用 Safari。</p>';
    $('#svS', m).textContent = fmtSize(blob.size) + '，準備好了';
    $('#svB', m).innerHTML = b;
    if ($('#svShare', m)) $('#svShare', m).onclick = function(){
      navigator.share({ files: [file], title: name }).then(function(){ m.close(); }).catch(function(e){ if (e && e.name !== 'AbortError') toast('無法分享，請改用「開啟檢視」'); });
    };
    if ($('#svDl', m)) $('#svDl', m).onclick = function(){
      var a = document.createElement('a'); a.href = u; a.download = name; a.rel = 'noopener'; document.body.appendChild(a); a.click(); a.remove();
      toast('已開始下載，請看瀏覽器的下載清單');
    };
    $('#svOpen', m).onclick = function(){
      var w = null; try { w = window.open(u, '_blank'); } catch(e){}
      if (!w) $('#svB', m).insertAdjacentHTML('beforeend', '<p class="hint">瀏覽器擋住了新分頁，請點：<a href="' + u + '" target="_blank" rel="noopener">開啟 ' + esc(name) + '</a>（電腦可按右鍵「另存連結」）</p>');
    };
  }).catch(function(e){ $('#svS', m).textContent = '讀取失敗：' + e.message; });
}
function leaveDecide(id, status){
  var ok = status === 'approved';
  modal('<h3>' + (ok ? '確認收到假單' : '需要家長補充說明') + '</h3><label class="f">回覆家長（選填）</label><input class="in-t" id="ln" maxlength="200" placeholder="' + (ok ? '例如：祝早日康復' : '例如：請補附就診證明') + '">' +
    '<div class="acts"><button class="btn line" id="x">取消</button><button class="btn ' + (ok ? 'okb' : 'bad') + '" id="go">送出</button></div>', function(m, close){
      $('#x', m).onclick = close;
      $('#go', m).onclick = function(){ run(this, api('decideLeave', { id: id, status: status, note: $('#ln', m).value }), '已回覆').then(function(){ close(); sync(true); }); };
    });
}
function openChangePin(first){
  modal('<h3>' + (first ? '歡迎！請設定您的家長密碼' : '變更家長密碼') + '</h3>' + (first ? '<p class="hint">為了安全，請把老師給的邀請碼換成您自己記得的密碼（4–20 碼）。</p>' : '') +

    '<div class="acts">' + (first ? '<button class="btn line" id="x">稍後再說</button>' : '<button class="btn line" id="x">取消</button>') + '<button class="btn" id="ok">設定</button></div>', function(m, close){
      $('#x', m).onclick = close;
      $('#ok', m).onclick = function(){
        if ($('#n', m).value !== $('#n2', m).value) { toast('兩次新密碼不一致'); return; }
        run(this, api('changePin', { oldPin: $('#o', m).value, newPin: $('#n', m).value }), '密碼設定完成').then(function(r){ close(); S.token = r.token; saveSession(); sync(true); });
      };
    });
}

})();
